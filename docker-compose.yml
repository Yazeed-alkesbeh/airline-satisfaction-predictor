version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=False
    volumes:
      - ./model/artifacts:/app/model/artifacts
      - ./data:/app/data
    depends_on:
      - train_models
    command: python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

  train_models:
    build:
      context: .
      dockerfile: model/Dockerfile
    volumes:
      - ./train.csv:/app/train.csv
      - ./test.csv:/app/test.csv
      - ./model/artifacts:/app/model/artifacts
    command: python model/train.py
    profiles: ["train"]  # Run with: docker-compose --profile train up
